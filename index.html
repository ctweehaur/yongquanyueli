<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华文智能互动学习阅读器 - 宣纸克莱因灰蓝精调版</title>
    <style>
        /* ==========================================================================
           📜 宣纸底色 × 矿物克莱因灰蓝精调配色系统 (Harmonized Xuan Paper & Slate-Blue)
           ========================================================================== */

        :root {
            /* 📜 1. 基底：温润宣纸与松烟墨字（冷暖平衡，绝不刺眼） */
            --bg-color: #f6f3ea;
            --bg-gradient: radial-gradient(circle at 20% 20%, #fbf9f4 0%, #ede7d8 100%);
            --text-color: #1e242b;         /* 松烟浓墨：比纯黑更柔和，带一丝微不可察的深蓝灰 */
            --text-muted: #686359;         /* 淡墨褐灰：与宣纸同色系的辅助字色 */
            --card-bg: #fdfbf7;            /* 熟宣白卡片：温润通透 */
            
            /* 🔷 2. 主色调：矿物克莱因灰蓝（全局统一主色） */
            --primary-color: #2b4c65;
            --primary-hover: #1d3649;

            /* 💧 3. 水痕洗染底色（半透明矿物蓝融入宣纸，全局统一） */
            --notebook-color: #2b4c65;
            --notebook-bg: rgba(43, 76, 101, 0.08);

            /* 🖋️ 4. 文本赏析：与主色调完全统一 */
            --ai-color: #2b4c65;
            --ai-bg: rgba(43, 76, 101, 0.06);

            /* ⚖️ 5. 正误状态色（高对比清晰可读，克制不刺眼） */
            --accent-color: #2b4c65;       /* 正确/强调：统一矿物克莱因灰蓝 */
            --accent-bg: rgba(43, 76, 101, 0.09);
            
            --wrong-color: #8c5347;        /* 按钮/清空：低饱和度陶土灰褐 */
            --wrong-bg: #f3e8e6;           /* 错题选项底色：柔和浅陶灰底 */
            --wrong-text: #7f392d;         /* 错题选项文字：高对比深陶褐字（清晰可读） */
            --wrong-border: #c99e95;       /* 错题选项边框 */

            --ruby-color: #7c6850;         /* 拼音：亚麻古铜褐，与宣纸自然呼应 */
            --input-border: #dcd5c5;       /* 宣纸亚麻边框：消除冷灰割裂感 */
            --shadow-sm: 0 4px 10px -2px rgba(45, 40, 32, 0.05), 0 2px 4px -1px rgba(45, 40, 32, 0.03);
            --shadow-md: 0 18px 35px -8px rgba(45, 40, 32, 0.07), 0 8px 12px -6px rgba(45, 40, 32, 0.04);
            --radius-lg: 16px;
            --radius-md: 10px;

            /* 🔠 动态字号变量（支持 A- / A+ 无级缩放） */
            --article-font-size: 19.5px;
            --ruby-font-size: 12.5px;
        }

        /* 🌙 暗黑模式：月夜砚台与星光灰蓝 */
        [data-theme="dark"] {
            --bg-color: #0d1218;
            --bg-gradient: radial-gradient(circle at top right, #161f29 0%, #0d1218 100%);
            --text-color: #e6e4de;         /* 暖米灰白字：夜读不伤眼 */
            --text-muted: #8e99a6;
            --card-bg: #151d26;            /* 砚台深灰蓝卡片底 */
            
            --primary-color: #6b9ac4;      /* 夜读清亮灰蓝 */
            --primary-hover: #8bb3d6;
            
            --notebook-color: #8bb3d6;
            --notebook-bg: rgba(107, 154, 196, 0.14);

            --ai-color: #8bb3d6;
            --ai-bg: rgba(107, 154, 196, 0.08);

            --accent-color: #6b9ac4;
            --accent-bg: rgba(107, 154, 196, 0.16);
            
            --wrong-color: #a86456;
            --wrong-bg: rgba(168, 100, 86, 0.22);
            --wrong-text: #f5c2b8;         /* 暗黑模式错题亮暖褐字，确保清晰可见 */
            --wrong-border: #a86456;

            --ruby-color: #b5a68f;
            --input-border: #2a3644;
            --shadow-sm: 0 4px 8px -1px rgba(0, 0, 0, 0.45);
            --shadow-md: 0 18px 35px -5px rgba(0, 0, 0, 0.65);
        }

        /* 🌟 极简纤细优雅滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cfc7b4;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #b0a690;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #2a3644;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #3d4e61;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 2.1;
            margin: 0;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ==========================================================================
           🧭 顶栏左右分组工具栏 & 可折叠生词本
           ========================================================================== */
        .top-container {
            width: 100%;
            max-width: 1440px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 🔘 顶栏按钮全局统一风格 */
        .control-panel button {
            padding: 9px 16px;
            border: 1px solid var(--input-border);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 700;
            font-size: 13.5px;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .control-panel button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: var(--accent-bg);
        }

        .control-panel button.is-active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }
        .control-panel button.is-active:hover {
            background: var(--primary-hover);
            color: #ffffff;
        }

        /* 字号调节紧凑按钮组 */
        .font-zoom-group {
            display: inline-flex;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            overflow: hidden;
            background: var(--card-bg);
            box-shadow: var(--shadow-sm);
        }
        .font-zoom-group button {
            border: none;
            border-radius: 0;
            box-shadow: none;
            padding: 9px 13px;
            font-size: 13px;
        }
        .font-zoom-group button:first-child {
            border-right: 1px solid var(--input-border);
        }
        .font-zoom-group button:hover {
            transform: none;
        }

        /* 📖 生词本支持词数统计与折叠收纳 */
        .vocab-notebook {
            width: 100%;
            background: var(--card-bg);
            padding: 16px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            transition: all 0.25s ease;
        }

        .notebook-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 15px;
            color: var(--text-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .notebook-title-left {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .nb-count-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            background: var(--notebook-bg);
            color: var(--notebook-color);
            border: 1px solid rgba(43, 76, 101, 0.18);
        }

        .notebook-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nb-action-btn {
            background: var(--notebook-bg);
            color: var(--notebook-color);
            border: 1px solid rgba(43, 76, 101, 0.2);
            padding: 4px 13px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .nb-action-btn:hover {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .nb-action-btn.danger:hover {
            background: var(--wrong-color);
            color: #ffffff;
            border-color: var(--wrong-color);
        }

        .notebook-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--input-border);
        }

        .vocab-notebook.is-collapsed .notebook-list {
            display: none;
        }

        .notebook-item {
            background: var(--notebook-bg);
            color: var(--notebook-color);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid rgba(43, 76, 101, 0.18);
            transition: all 0.2s;
        }

        .notebook-item:hover {
            background: var(--primary-color);
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* ==========================================================================
           🖥️ 左右双栏 5.8 : 4.2 黄金阅读比 (1.38fr : 1fr)
           ========================================================================== */
        .workspace-layout {
            display: grid;
            grid-template-columns: 1.38fr 1fr;
            gap: 24px;
            width: 100%;
            max-width: 1440px;
            align-items: start;
            transition: all 0.3s ease;
        }

        /* 生词测试弹窗区 */
        .game-container {
            width: 100%;
            max-width: 1440px;
            background: var(--card-bg);
            padding: 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            margin-bottom: 22px;
            box-sizing: border-box;
            border: 1px solid var(--input-border);
        }

        .quiz-card { text-align: center; padding: 10px 0; }
        .quiz-pinyin { font-size: 16px; color: var(--ruby-color); margin-bottom: 25px; font-weight: 600; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .quiz-opt-btn {
            padding: 14px 20px;
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .quiz-opt-btn:hover {
            background: var(--accent-bg) !important;
            border-color: var(--primary-color) !important;
            color: var(--primary-color) !important;
        }
        .quiz-opt-btn.correct { background: var(--accent-color) !important; color: white !important; border-color: var(--accent-color); }
        .quiz-opt-btn.wrong { background: var(--wrong-bg) !important; color: var(--wrong-text) !important; border: 1.5px dashed var(--wrong-border) !important; cursor: not-allowed; }

        #quizQuestion {
            font-size: 40px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 2px;
        }

        /* ==========================================================================
           📄 左侧课文卡片 & 段落联动呼吸高亮
           ========================================================================== */
        .article-card {
            width: 100%;
            background: var(--card-bg);
            padding: 42px 46px 42px 72px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            max-height: 82vh;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        h1 {
            text-align: center;
            font-size: 31px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 32px;
            margin-left: -26px;
            letter-spacing: 2px;
            font-family: "KaiTi", "STKaiti", serif;
            color: var(--text-color);
        }

        #content p {
            text-align: justify;
            text-justify: inter-ideograph;
            margin-bottom: 32px;
            font-size: var(--article-font-size);
            letter-spacing: 1.6px;
            border-radius: 8px;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes paragraphPulse {
            0% { background-color: var(--accent-bg); box-shadow: 0 0 0 6px var(--accent-bg); }
            70% { background-color: var(--accent-bg); box-shadow: 0 0 0 6px var(--accent-bg); }
            100% { background-color: transparent; box-shadow: none; }
        }
        .p-highlight-flash {
            animation: paragraphPulse 1.8s ease-out;
        }

        .p-index {
            position: absolute;
            left: -54px;
            top: 6px;
            width: 44px;
            text-align: center;
            text-indent: 0;
            font-size: 11.5px;
            line-height: 1.6;
            background: var(--notebook-bg);
            color: var(--notebook-color);
            padding: 1px 0;
            border-radius: 5px;
            font-weight: 700;
            user-select: none;
            border: 1px solid rgba(43, 76, 101, 0.16);
            transition: all 0.25s ease;
        }
        .p-highlight-flash .p-index {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        /* 📍 右侧题目中的“📍第X段”可点击定位芯片 */
        .para-jump-link {
            display: inline-flex;
            align-items: center;
            padding: 0 7px;
            margin: 0 2px;
            font-size: 0.9em;
            font-weight: 800;
            color: var(--primary-color);
            background: var(--notebook-bg);
            border: 1px solid rgba(43, 76, 101, 0.22);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            line-height: 1.5;
        }
        .para-jump-link:hover {
            background: var(--primary-color);
            color: #ffffff;
            transform: translateY(-1px);
        }

        ruby { ruby-position: over; cursor: pointer; padding: 0 2px; border-radius: 4px; transition: all 0.2s ease; }
        ruby:hover, ruby.is-active { background: var(--accent-bg); color: var(--primary-color); }

        /* 🔤 拼音三态控制 */
        #content rt {
            opacity: 0;
            transition: opacity 0.2s ease;
            user-select: none;
            font-size: var(--ruby-font-size);
            color: var(--ruby-color);
            font-weight: 700;
            padding-bottom: 6px;
        }
        #content ruby:hover rt, #content ruby.is-active rt { opacity: 1; }
        #content[data-pinyin-mode="show"] rt { opacity: 1 !important; }
        #content[data-pinyin-mode="hide"] rt { opacity: 0 !important; }

        /* ==========================================================================
           🗂️ 右侧题目卡片 & 顶部吸顶分段标签栏
           ========================================================================== */
        .quiz-side-card {
            width: 100%;
            background: var(--card-bg);
            padding: 0 36px 38px 36px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid var(--input-border);
            max-height: 82vh;
            overflow-y: auto;
            display: none;
            transition: max-height 0.3s ease;
            scroll-behavior: smooth;
        }

        .quiz-sticky-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--card-bg);
            padding: 24px 0 16px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--input-border);
        }

        .quiz-tabs-bar {
            display: flex;
            background: var(--notebook-bg);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(43, 76, 101, 0.14);
            gap: 4px;
        }

        .quiz-tab-btn {
            flex: 1;
            padding: 8px 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13.5px;
            font-weight: 700;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .quiz-tab-btn:hover {
            color: var(--primary-color);
        }

        .quiz-tab-btn.is-active {
            background: var(--primary-color);
            color: #ffffff;
            box-shadow: var(--shadow-sm);
        }

        .section-sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--input-border);
        }

        .section-sub-header h2 {
            font-size: 18px;
            margin: 0;
            color: var(--text-color);
        }

        .quiz-question-box {
            margin-bottom: 22px;
            padding: 12px 14px 18px 14px;
            margin-left: -14px;
            margin-right: -14px;
            border-bottom: 1px dashed var(--input-border);
            border-radius: var(--radius-md);
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        @keyframes unanswerPulse {
            0%, 100% { background-color: transparent; box-shadow: none; }
            25%, 75% { background-color: var(--wrong-bg); box-shadow: 0 0 0 2px var(--wrong-border); }
        }
        .quiz-unanswered-flash {
            animation: unanswerPulse 1.5s ease-in-out;
        }

        /* ==========================================================================
           💬 词典气泡弹窗（新增独立『译』标签行，支持三语整齐对齐）
           ========================================================================== */
        .buddy-popover {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 20px;
            width: 300px;
            box-sizing: border-box;
            border: 1.5px solid var(--primary-color);
            animation: popIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .pop-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--input-border); padding-bottom: 10px; }
        .pop-title { font-size: 24px; font-weight: 800; font-family: "KaiTi", "STKaiti", serif; }
        .pop-pinyin { font-size: 14px; color: var(--ruby-color); font-weight: 800; }
        .pop-box { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; margin-bottom: 10px; line-height: 1.55; font-weight: 600; }
        .pop-tag {
            font-size: 11px;
            font-weight: 800;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            min-width: 28px;
            text-align: center;
            box-sizing: border-box;
            line-height: 1.4;
            margin-top: 1px;
        }
        /* 新增：独立『译』标签样式（文言/古诗白话今译） */
        .pop-zh { color: var(--text-color); font-weight: 700; }
        .pop-zh .pop-tag { background: var(--primary-color); }

        .pop-en { color: var(--primary-color); }
        .pop-en .pop-tag { background: var(--primary-color); opacity: 0.88; }

        .pop-bm { color: var(--text-muted); }
        .pop-bm .pop-tag { background: var(--ruby-color); }

        .pop-footer { display: flex; justify-content: flex-end; margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--input-border); }
        .pop-btn-copy { background: var(--primary-color); color: white; border: none; padding: 6px 16px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-weight: 800; transition: opacity 0.2s; }
        .pop-btn-copy:hover { opacity: 0.9; }

        .pop-arrow {
            position: absolute;
            bottom: -8px;
            left: 50%;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--primary-color);
            transform: translateX(-50%);
        }
        .buddy-popover.is-flipped .pop-arrow {
            bottom: auto;
            top: -8px;
            border-top: none;
            border-bottom: 8px solid var(--primary-color);
        }

        /* 🔘 客观选择题选项按钮样式 */
        .quiz-choice-btn { 
            background: var(--card-bg) !important; 
            color: var(--text-color) !important; 
            border: 1px solid var(--input-border) !important; 
            font-weight: 600; 
            transition: all 0.15s ease !important; 
            opacity: 1 !important;
        }
        .quiz-choice-btn:hover:not(:disabled) {
            background: var(--accent-bg) !important;
            border-color: var(--primary-color) !important;
            color: var(--primary-color) !important;
            transform: translateY(-1px);
        }
        .quiz-choice-btn.selected { 
            background: var(--accent-bg) !important; 
            border: 2px solid var(--primary-color) !important; 
            color: var(--primary-color) !important; 
            font-weight: 800 !important; 
        }
        .quiz-choice-btn.correct-answer-hint { 
            background: var(--accent-color) !important; 
            border: 2px solid var(--accent-color) !important; 
            color: #ffffff !important; 
            font-weight: 800 !important; 
        }
        .quiz-choice-btn.wrong-answer-hint {
            background: var(--wrong-bg) !important;
            border: 1.5px dashed var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            font-weight: 700 !important;
        }
